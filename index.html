<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrimônio Pro — Nova Russas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
        :root { --primary: #3b82f6; --bg: #0b0d11; --surface: #13161e; --surface2: #1b1f2b; --border: rgba(255,255,255,0.07); --text: #e2e8f0; --muted: #64748b; --danger: #ef4444; }
        * { box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; }
        .search-wrap { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; position: sticky; top: 57px; z-index: 150; }
        .search-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: white; font-family: 'IBM Plex Mono'; font-size: 20px; outline: none; }
        .main { padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        #cameraWrap { display: none; margin: 12px auto 0; width: 100%; max-width: 400px; height: 250px; border-radius: 12px; overflow: hidden; border: 2px solid var(--primary); position: relative; background: #000; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="topbar">
    <div style="font-family:'IBM Plex Mono'; font-weight:600; color:var(--primary)">Patrimônio/pro</div>
    <span id="totalCount" style="font-size:12px; font-family:monospace">0 itens</span>
</div>

<div class="search-wrap">
    <div style="display:flex; gap:8px; max-width:680px; margin:0 auto">
        <input type="text" id="searchInput" class="search-input" placeholder="Digite o tombo..." oninput="filtrar()">
        <button id="camBtn" style="padding:0 15px; border:none; background:var(--primary); border-radius:10px; cursor:pointer" onclick="toggleCamera()">📷</button>
    </div>
    <div id="cameraWrap"><video id="video" autoplay playsinline></video></div>
</div>

<div class="main">
    <div id="offlineNotice" style="display:none; background: #443a15; color: #f6e05e; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 12px; text-align: center;">
        Modo Offline: Busca liberada. (Importar Excel/Câmera requer internet)
    </div>
    <div style="margin-bottom:15px; display:flex; justify-content: flex-end;">
        <button class="btn-add" onclick="document.getElementById('fileInput').click()">+ Adicionar Dados</button>
        <input type="file" id="fileInput" hidden accept=".xlsx,.xls" multiple>
    </div>
    <div id="cardContainer"></div>
</div>

<script>
let DATABASE = [];

// CARREGAR DADOS IMEDIATAMENTE (NÃO DEPENDE DE NADA)
function carregar() {
    try {
        const raw = localStorage.getItem('pat_db_v5');
        DATABASE = raw ? JSON.parse(raw) : [];
        document.getElementById('totalCount').textContent = DATABASE.length + " itens";
        filtrar();
        
        // Verifica se as bibliotecas carregaram, se não, avisa o usuário
        if (typeof XLSX === 'undefined') {
            document.getElementById('offlineNotice').style.display = 'block';
            document.getElementById('camBtn').style.opacity = '0.5';
        }
    } catch(e) { console.error("Erro ao carregar banco local"); }
}

function filtrar() {
    const term = document.getElementById('searchInput').value;
    const lista = DATABASE.filter(i => i.t.includes(term));
    
    const mostrados = new Set();
    const html = lista.filter(item => {
        if (mostrados.has(item.t)) return false;
        mostrados.add(item.t);
        return true;
    }).map(i => `
        <div class="card">
            <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted)">
                <span>${i.m}</span><b style="color:var(--primary); font-size:18px">#${i.t}</b>
            </div>
            <div style="margin:10px 0">${i.d}</div>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; font-size:11px; border-top:1px solid var(--border); padding-top:10px">
                <div>STATUS<br><b>${i.s}</b></div>
                <div>DATA<br>${i.da}</div>
                <div>VALOR<br>R$ ${i.v}</div>
            </div>
        </div>
    `).join('');
    
    document.getElementById('cardContainer').innerHTML = html || '<div style="text-align:center; opacity:0.5">Nenhum tombo encontrado.</div>';
}

// FUNÇÕES QUE DEPENDEM DE INTERNET COM TRAVA DE SEGURANÇA
document.getElementById('fileInput').addEventListener('change', async function(e) {
    if (typeof XLSX === 'undefined') return alert("Você precisa de internet para importar novos arquivos Excel.");
    
    const files = Array.from(e.target.files);
    for (const file of files) {
        await new Promise(res => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array'});
                wb.SheetNames.forEach(s => {
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[s], {header:1});
                    rows.forEach(r => {
                        const t = String(r[0]||'').replace(/[^0-9]/g,'');
                        if(t.length >= 3) DATABASE.push({id:Math.random(), t:t, d:String(r[1]||''), da:String(r[2]||''), s:String(r[3]||''), v:String(r[4]||''), m:file.name});
                    });
                });
                res();
            };
            reader.readAsArrayBuffer(file);
        });
    }
    localStorage.setItem('pat_db_v5', JSON.stringify(DATABASE));
    carregar();
});

async function toggleCamera() {
    if (typeof Tesseract === 'undefined') return alert("A câmera com leitura automática precisa de internet.");
    const w = document.getElementById('cameraWrap');
    if(window.s) { window.s.getTracks().forEach(t=>t.stop()); window.s=null; w.style.display='none'; }
    else {
        window.s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        document.getElementById('video').srcObject = window.s;
        w.style.display='block';
    }
}

window.onload = carregar;
</script>
</body>
</html>

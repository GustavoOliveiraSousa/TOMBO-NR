<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrimônio Pro — Nova Russas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
        :root { --primary: #3b82f6; --bg: #0b0d11; --surface: #13161e; --surface2: #1b1f2b; --border: rgba(255,255,255,0.07); --text: #e2e8f0; --muted: #64748b; --danger: #ef4444; }
        
        * { box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        
        .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; }
        
        .search-wrap { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; position: sticky; top: 57px; z-index: 150; }
        .search-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: white; font-family: 'IBM Plex Mono'; font-size: 20px; outline: none; }
        
        /* AQUI ESTÁ A CORREÇÃO DA CÂMERA */
        #cameraWrap { 
            display: none; 
            margin: 12px auto 0; 
            max-width: 100%; 
            width: 400px; /* Limite de largura no PC */
            height: 250px; /* Limite de altura fixa para não explodir na tela */
            border-radius: 12px; 
            overflow: hidden; 
            border: 2px solid var(--primary); 
            position: relative;
            background: #000;
        }
        
        #video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Faz o vídeo preencher o quadrado sem distorcer */
        }

        .btn-snap {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--primary);
            cursor: pointer;
            z-index: 10;
        }

        .main { padding: 20px; max-width: 800px; margin: 0 auto; }
        .modules-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .module-tag { background: rgba(59,130,246,0.1); border: 1px solid #3b82f6; color: #3b82f6; border-radius: 6px; padding: 4px 10px; font-size: 11px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-clean { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

<div class="topbar">
    <div style="font-family:'IBM Plex Mono'; font-weight:600; color:var(--primary)">Patrimônio/pro</div>
    <div style="display:flex; gap:15px; align-items:center">
        <span id="totalCount" style="font-size:12px; font-family:monospace">0 itens</span>
        <button class="btn-clean" onclick="limparTudo()">🗑️ Resetar</button>
    </div>
</div>

<div class="search-wrap">
    <div style="display:flex; gap:8px; max-width:680px; margin:0 auto">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar tombo..." oninput="filtrar()">
        <button style="padding:0 15px; border:none; background:var(--primary); border-radius:10px; cursor:pointer" onclick="toggleCamera()">📷</button>
    </div>
    
    <!-- Container da câmera com tamanho controlado -->
    <div id="cameraWrap">
        <video id="video" autoplay playsinline></video>
        <div class="btn-snap" onclick="capturarFoto()"></div>
    </div>
</div>

<div class="main">
    <div class="modules-bar">
        <div id="moduleList" style="flex:1; display:flex; gap:8px; flex-wrap:wrap"></div>
        <button class="btn-add" onclick="document.getElementById('fileInput').click()">+ Excel</button>
        <input type="file" id="fileInput" hidden accept=".xlsx,.xls" multiple>
    </div>
    <div id="cardContainer"></div>
</div>

<script>
let DATABASE = [];

function salvar() {
    localStorage.setItem('pat_db_v5', JSON.stringify(DATABASE));
    render();
}

function carregar() {
    const raw = localStorage.getItem('pat_db_v5');
    DATABASE = raw ? JSON.parse(raw) : [];
    render();
}

function limparTudo() {
    if(confirm("Apagar todos os dados?")) {
        DATABASE = [];
        localStorage.removeItem('pat_db_v5');
        render();
    }
}

document.getElementById('fileInput').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files);
    for (const file of files) {
        await new Promise(res => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array'});
                let items = [];
                wb.SheetNames.forEach(s => {
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[s], {header:1});
                    rows.forEach(r => {
                        const t = String(r[0]||'').replace(/[^0-9]/g,'');
                        if(t.length >= 3) {
                            items.push({
                                id: t + "_" + Math.random(), 
                                t: t, d: String(r[1]||'S/ Desc'), da: String(r[2]||'-'),
                                s: String(r[3]||'S/ Status'), v: String(r[4]||'0,00'), m: file.name
                            });
                        }
                    });
                });
                DATABASE = DATABASE.concat(items);
                res();
            };
            reader.readAsArrayBuffer(file);
        });
    }
    salvar();
    this.value = '';
});

function removerModulo(nome) {
    DATABASE = DATABASE.filter(i => i.m !== nome);
    salvar();
}

function render() {
    document.getElementById('totalCount').textContent = DATABASE.length + " itens";
    const mods = [...new Set(DATABASE.map(i => i.m))];
    document.getElementById('moduleList').innerHTML = mods.map(m => `
        <div class="module-tag">${m} <span onclick="removerModulo('${m}')" style="margin-left:5px; cursor:pointer; color:red">×</span></div>
    `).join('');
    filtrar();
}

function renderCards(lista) {
    const mostrados = new Set();
    const listaUnicaParaExibicao = lista.filter(item => {
        if (mostrados.has(item.t)) return false;
        mostrados.add(item.t);
        return true;
    });

    document.getElementById('cardContainer').innerHTML = listaUnicaParaExibicao.map(i => `
        <div class="card">
            <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted)">
                <span>${i.m}</span><b style="color:var(--primary); font-size:18px">#${i.t}</b>
            </div>
            <div style="margin:10px 0">${i.d}</div>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; font-size:11px; border-top:1px solid var(--border); padding-top:10px">
                <div>STATUS<br><b>${i.s}</b></div>
                <div>DATA<br>${i.da}</div>
                <div>VALOR<br>R$ ${i.v}</div>
            </div>
        </div>
    `).join('');
}

function filtrar() {
    const v = document.getElementById('searchInput').value;
    const listaFiltrada = DATABASE.filter(i => i.t.includes(v));
    renderCards(listaFiltrada);
}

async function toggleCamera() {
    const w = document.getElementById('cameraWrap');
    if(window.s) { 
        window.s.getTracks().forEach(t=>t.stop()); 
        window.s=null; 
        w.style.display='none'; 
    } else {
        try {
            window.s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
            document.getElementById('video').srcObject = window.s;
            w.style.display='block';
        } catch(e) {
            alert("Erro ao acessar câmera.");
        }
    }
}

async function capturarFoto() {
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; 
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    toggleCamera(); // Desliga a câmera após bater a foto
    
    const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
    const num = text.replace(/[^0-9]/g, '');
    if(num) {
        document.getElementById('searchInput').value = num;
        filtrar();
    }
}

window.onload = carregar;
</script>
</body>
</html>

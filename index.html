<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUSCA OFFLINE - Patrimônio</title>
    <style>
        :root { --primary: #3b82f6; --bg: #0b0d11; --surface: #13161e; --text: #e2e8f0; --border: rgba(255,255,255,0.1); }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .search-input { 
            width: 100%; background: #1b1f2b; border: 2px solid var(--primary); 
            border-radius: 10px; padding: 15px; color: white; font-size: 22px; 
            margin-bottom: 20px; outline: none;
        }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .count { font-size: 14px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight:bold; font-size:18px">Patrimônio Pro</div>
    <div id="totalCount" class="count">0 itens</div>
</div>

<input type="text" id="searchInput" class="search-input" placeholder="Digite o tombo aqui..." onkeyup="filtrar()">

<div id="cardContainer"></div>

<script>
    let DATABASE = [];

    // Carrega o que já está salvo no seu celular das versões anteriores
    function carregar() {
        const raw = localStorage.getItem('pat_db_v5');
        DATABASE = raw ? JSON.parse(raw) : [];
        document.getElementById('totalCount').textContent = DATABASE.length + " itens carregados";
        filtrar();
    }

    function filtrar() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('cardContainer');
        
        if (term.length < 2 && term !== "") {
            container.innerHTML = '<div style="opacity:0.5; text-align:center">Digite ao menos 2 números...</div>';
            return;
        }

        const lista = DATABASE.filter(i => i.t.includes(term));
        const mostrados = new Set();
        
        const html = lista.filter(item => {
            if (mostrados.has(item.t)) return false;
            mostrados.add(item.t);
            return true;
        }).map(i => `
            <div class="card">
                <div style="display:flex; justify-content:space-between; opacity:0.6; font-size:12px">
                    <span>${i.m}</span><b>#${i.t}</b>
                </div>
                <div style="margin:10px 0; font-size:16px; font-weight:500">${i.d}</div>
                <div style="font-size:11px; border-top:1px solid var(--border); padding-top:10px; display:grid; grid-template-columns: 1fr 1fr">
                    <div>Status: ${i.s}</div>
                    <div>Data: ${i.da}</div>
                </div>
            </div>
        `).join('');

        container.innerHTML = html || '<div style="text-align:center; padding:20px; opacity:0.3">Nenhum tombo encontrado.</div>';
    }

    // Inicia na hora
    carregar();
</script>
</body>
</html>
